[project]
name = "bibi"
version = "0.1.0"
description = "bibi — deploybare Engine (bibi-ctrl + Skills/Agents) für Markdown-geführte Team-Repos"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bibi-ctrl = "bibi.ctrl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bibi"]
