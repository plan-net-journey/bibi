[project]
name = "bibi"
version = "0.7.10"
description = "bibi — deploybare Engine (bibi-ctrl + Skills/Agents) für Markdown-geführte Team-Repos"
requires-python = ">=3.11"
# PEP 639: SPDX-Ausdruck statt `License ::`-Classifier (die sind damit deprecated).
# `license-files` legt die LICENSE ins Wheel — MIT verlangt, dass Copyright-Hinweis
# und Lizenztext bei jeder Weitergabe beiliegen, und ein Wheel ist eine Weitergabe.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Rau" }]
dependencies = [
    "pyyaml>=6.0",
    # Scheduling-Kerndomäne (Trigger-Syntax §5.2): cron-Parsing + ISO-8601.
    # Pure-Python, leichtgewichtig — gehört zum Kern, nicht ins daemon-Extra.
    "croniter>=2.0",
    "python-dateutil>=2.8",
]

# Der Daemon ist optional (DESIGN §4.1) — nur wer ihn fährt, braucht diese Deps:
#   uv pip install "bibi[daemon]"
[project.optional-dependencies]
daemon = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
# bibi startet, bibi-ctrl steuert (m.rau/bibi#48).
bibi = "bibi.session:main"
bibi-ctrl = "bibi.ctrl:main"

[dependency-groups]
# httpx2: von starlette>=1.3 für TestClient bevorzugt (sonst DeprecationWarning).
dev = [
    "pytest>=8",
    "httpx2>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6",
]
# Die Browser-Ebene (#84) in einer **eigenen** Gruppe, nicht in `dev`.
#
# `dev` ist, was jeder Lauf braucht — auch der Engine-CI, der bei jedem Push
# anspringt und in 70 Sekunden durch sein soll. `playwright` bringt einen
# Chromium-Download von rund 150 MB mit; ihn in `dev` zu legen hiesse, dass ihn
# jeder frische Klon zieht, ob er einen Browser fährt oder nicht. Die Ebene
# läuft in ihrem eigenen Job (`browser-ci.sh`), und der installiert sie sich
# ausdrücklich: `uv sync --group browser`.
browser = [
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: echte Prozesse/Docker — nur mit --slow",
    "browser: echter Daemon + echter Browser — nur mit --browser-tests",
]
# Parallel als Standard (m.rau/bibi#115). Auf 8 Kernen gemessen: die volle Suite
# parallel (53 s) ist schneller als die halbe seriell (86 s). Damit ist der
# `slow`-Marker als Geschwindigkeitswerkzeug hinfällig — er benennt nur noch,
# was wirklich teuer ist: echte Signalzustellung, Docker, Silence-Timeouts.
#
# `auto` nimmt alle Kerne. Läuft daneben ein Daemon, ist `-n logical-1` der
# Rückfallweg; ein `-n` auf der Kommandozeile gewinnt gegen diesen Wert.
addopts = "-n auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bibi"]
