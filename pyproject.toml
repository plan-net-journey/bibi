[project]
name = "bibi"
version = "0.2.3"
description = "bibi — deploybare Engine (bibi-ctrl + Skills/Agents) für Markdown-geführte Team-Repos"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    # Scheduling-Kerndomäne (Trigger-Syntax §5.2): cron-Parsing + ISO-8601.
    # Pure-Python, leichtgewichtig — gehört zum Kern, nicht ins daemon-Extra.
    "croniter>=2.0",
    "python-dateutil>=2.8",
]

# Der Daemon ist optional (DESIGN §4.1) — nur wer ihn fährt, braucht diese Deps:
#   uv pip install "bibi[daemon]"
[project.optional-dependencies]
daemon = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
bibi-ctrl = "bibi.ctrl:main"

[dependency-groups]
# httpx2: von starlette>=1.3 für TestClient bevorzugt (sonst DeprecationWarning).
dev = [
    "pytest>=8",
    "httpx2>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: echte Prozesse/Docker — nur mit --slow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bibi"]
