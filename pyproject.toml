[project]
name = "bibi"
version = "0.1.0"
description = "bibi — deploybare Engine (bibi-ctrl + Skills/Agents) für Markdown-geführte Team-Repos"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

# Der Daemon ist optional (DESIGN §4.1) — nur wer ihn fährt, braucht diese Deps:
#   uv pip install "bibi[daemon]"
[project.optional-dependencies]
daemon = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
bibi-ctrl = "bibi.ctrl:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bibi"]
